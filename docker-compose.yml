# Full stack: PostgreSQL + core + the three protocol gateways.
#
#   docker compose up --build
#
# The frontend is built inside the image and served by the core at :8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiiot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8080
      WEB_DIR: /app/web/dist
      JWT_SECRET: change-me-in-production-please-32chars
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: aiiot
      DB_SSLMODE: disable
      GATEWAY_TOKEN: change-me-gateway-token
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "8080:8080"

  mqtt-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/bin/mqtt-gateway"]
    environment:
      GATEWAY_CORE_URL: http://core:8080
      GATEWAY_TOKEN: change-me-gateway-token
      GATEWAY_INSTANCE_ID: mqtt-1
      GATEWAY_DOWNLINK_ADDR: 0.0.0.0:9101
      GATEWAY_ADVERTISE_HOST: mqtt-gateway
      NATS_URL: nats://nats:4222
      MQTT_TCP_ADDR: 0.0.0.0:1883
    depends_on:
      core:
        condition: service_started
      nats:
        condition: service_healthy
    ports:
      - "1883:1883"

  coap-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/bin/coap-gateway"]
    environment:
      GATEWAY_CORE_URL: http://core:8080
      GATEWAY_TOKEN: change-me-gateway-token
      GATEWAY_INSTANCE_ID: coap-1
      GATEWAY_DOWNLINK_ADDR: 0.0.0.0:9102
      GATEWAY_ADVERTISE_HOST: coap-gateway
      NATS_URL: nats://nats:4222
      COAP_UDP_ADDR: 0.0.0.0:5683
    depends_on:
      core:
        condition: service_started
      nats:
        condition: service_healthy
    ports:
      - "5683:5683/udp"

  custom-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/bin/custom-gateway"]
    environment:
      GATEWAY_CORE_URL: http://core:8080
      GATEWAY_TOKEN: change-me-gateway-token
      GATEWAY_INSTANCE_ID: custom-1
      GATEWAY_DOWNLINK_ADDR: 0.0.0.0:9103
      GATEWAY_ADVERTISE_HOST: custom-gateway
      NATS_URL: nats://nats:4222
      CUSTOM_TCP_ADDR: 0.0.0.0:9000
    depends_on:
      core:
        condition: service_started
      nats:
        condition: service_healthy
    ports:
      - "9000:9000"

volumes:
  pgdata:
  natsdata:
